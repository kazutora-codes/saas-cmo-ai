# Brick 8 — autopilot loop (free, local)

# Kill switch: create this file to halt the loop between steps
kill_switch: "data/autopilot/STOP"

state_path: "data/autopilot/state.json"
log_dir: "data/autopilot/runs"

cycle:
  market_intel: true
  strategy: true
  content: true
  publish: true
  analytics_import: true
  learning: true

content:
  slots_per_cycle: 2
  prefer_today: true
  max_regenerate: 3
  use_intel: true
  use_llm_judge: false

publish:
  force_export: true

loop:
  interval_minutes: 60
  max_cycles: 0

llm:
  allow_no_llm: true
